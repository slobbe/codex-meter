name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install validation dependencies
              shell: bash
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y gir1.2-soup-3.0 gjs jq libglib2.0-bin zip

                  python -m pip install --upgrade pip
                  # shexli 0.2.1 currently segfaults with tree-sitter 0.26.0.
                  pip install -U shexli "tree-sitter==0.25.2"

            - name: Install Node.js dependencies
              run: npm ci

            - name: Validate metadata
              shell: bash
              run: |
                  set -euo pipefail
                  jq empty src/metadata.json
                  jq -e '
                    .uuid == "codex-meter@slobbe.github.io"
                    and (.name | type == "string" and length > 0)
                    and (.description | type == "string" and length > 0)
                    and (."version-name" | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
                    and (."shell-version" | type == "array" and length > 0)
                    and (."settings-schema" == "org.gnome.shell.extensions.codex-meter")
                  ' src/metadata.json

                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  METADATA_VERSION="$(jq -r '."version-name"' src/metadata.json)"

                  if [[ "${PACKAGE_VERSION}" != "${METADATA_VERSION}" ]]; then
                    echo "package.json version ${PACKAGE_VERSION} does not match metadata.json version-name ${METADATA_VERSION}" >&2
                    exit 1
                  fi

            - name: Run checks
              run: make check

            - name: Build extension bundle
              run: make pack

            - name: Run Shexli static analyzer
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  UUID="$(jq -r '.uuid' src/metadata.json)"
                  ZIP="${UUID}-v${VERSION}.zip"

                  shexli "${ZIP}"
