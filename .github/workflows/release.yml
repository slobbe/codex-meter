name: Release

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: write
    actions: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Install release dependencies
              shell: bash
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y jq zip

            - name: Validate release source and CI
              id: source
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  TAG="${GITHUB_REF_NAME}"

                  if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Release tag must match vMAJOR.MINOR.PATCH: ${TAG}" >&2
                    exit 1
                  fi

                  git fetch origin main --no-tags
                  TAG_SHA="$(git rev-parse "${TAG}^{commit}")"

                  if ! git merge-base --is-ancestor "${TAG_SHA}" origin/main; then
                    echo "Tag ${TAG} does not point to a commit on main" >&2
                    exit 1
                  fi

                  CI_RUN_ID=""
                  for attempt in {1..20}; do
                    CI_RUN="$(gh api \
                      "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TAG_SHA}&event=push&per_page=1" \
                      --jq 'if .workflow_runs[0] then (.workflow_runs[0] | [.id, .status, .conclusion, .head_branch] | @tsv) else empty end')"

                    if [[ -z "${CI_RUN}" ]]; then
                      echo "Waiting for CI to start for ${TAG_SHA} (${attempt}/20)"
                      sleep 30
                      continue
                    fi

                    IFS=$'\t' read -r RUN_ID RUN_STATUS RUN_CONCLUSION RUN_BRANCH <<< "${CI_RUN}"

                    if [[ "${RUN_BRANCH}" != "main" ]]; then
                      echo "CI run ${RUN_ID} is for ${RUN_BRANCH}, not main" >&2
                      exit 1
                    fi

                    if [[ "${RUN_STATUS}" == "completed" ]]; then
                      if [[ "${RUN_CONCLUSION}" != "success" ]]; then
                        echo "CI run ${RUN_ID} completed with ${RUN_CONCLUSION}" >&2
                        exit 1
                      fi

                      CI_RUN_ID="${RUN_ID}"
                      break
                    fi

                    echo "Waiting for CI run ${RUN_ID} (${RUN_STATUS}, ${attempt}/20)"
                    sleep 30
                  done

                  if [[ -z "${CI_RUN_ID}" ]]; then
                    echo "No successful CI run found for ${TAG_SHA}" >&2
                    exit 1
                  fi

                  echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
                  echo "tag_version=${TAG#v}" >> "${GITHUB_OUTPUT}"

            - name: Validate release metadata
              shell: bash
              run: |
                  set -euo pipefail
                  TAG_VERSION="${{ steps.source.outputs.tag_version }}"
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  METADATA_VERSION="$(jq -r '."version-name"' src/metadata.json)"

                  if [[ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]]; then
                    echo "Tag version ${TAG_VERSION} does not match package version ${PACKAGE_VERSION}" >&2
                    exit 1
                  fi

                  if [[ "${METADATA_VERSION}" != "${TAG_VERSION}" ]]; then
                    echo "Tag version ${TAG_VERSION} does not match metadata version-name ${METADATA_VERSION}" >&2
                    exit 1
                  fi

            - name: Build extension bundle
              run: make pack

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  TAG="${{ steps.source.outputs.tag }}"
                  TAG_VERSION="${{ steps.source.outputs.tag_version }}"
                  UUID="$(jq -r '.uuid' src/metadata.json)"
                  ZIP="${UUID}-v${TAG_VERSION}.zip"

                  if gh release view "${TAG}" >/dev/null 2>&1; then
                    gh release upload "${TAG}" "${ZIP}" --clobber
                  else
                    gh release create "${TAG}" "${ZIP}" \
                      --title "${TAG}" \
                      --generate-notes \
                      --verify-tag
                  fi
